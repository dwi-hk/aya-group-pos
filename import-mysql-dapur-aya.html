<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f57c00">
  <title>Import MySQL Barang — AYA POS</title>
  <style>
    :root{color-scheme:dark;--orange:#f57c00;--panel:#17191e;--line:#343942;--text:#f5f5f5;--muted:#aeb5c0}
    *{box-sizing:border-box}body{margin:0;background:#0f1115;color:var(--text);font-family:Arial,sans-serif}
    main{width:min(900px,calc(100% - 24px));margin:28px auto}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
    h1,h2{margin-top:0}.muted{color:var(--muted);line-height:1.55}
    label{display:grid;gap:7px;margin-bottom:12px;font-weight:700}
    input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:12px}
    input,select{background:#0e1014;color:var(--text);width:100%}
    button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#111;border-color:var(--orange)}
    .secondary{background:#242830;color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .metric{padding:14px;border:1px solid var(--line);border-radius:12px}.metric span{display:block;color:var(--muted)}
    .metric strong{display:block;font-size:1.45rem;margin-top:6px}
    progress{width:100%;height:22px}.success{color:#7ee787}.error{color:#ff7b72}
    code{background:#0d0f13;padding:2px 6px;border-radius:6px}
    @media(max-width:650px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Import Barang MySQL → DAPUR AYA</h1>
    <p class="muted">
      Halaman ini hanya menambahkan atau memperbarui data yang dipilih.
      Data Firebase yang lain tidak dihapus. Gunakan akun Owner.
    </p>
  </section>

  <section class="card">
    <h2>1. Login Owner</h2>
    <form id="loginForm">
      <label>Email Owner<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" minlength="6" required></label>
      <button class="primary">Login</button>
    </form>
    <p id="loginState" class="muted">Belum login.</p>
  </section>

  <section class="card">
    <h2>2. Pilih File Hasil Konversi</h2>
    <label>File JSON
      <input id="jsonFile" type="file" accept=".json,application/json">
    </label>
    <div id="summary" class="grid"></div>
    <p id="fileState" class="muted">Belum ada file dipilih.</p>
  </section>

  <section class="card">
    <h2>3. Jalankan Import</h2>
    <label>
      Perlakuan jika ID barang sudah ada
      <select id="existingMode">
        <option value="skip">Lewati barang yang sudah ada — disarankan</option>
        <option value="overwrite">Perbarui barang yang sudah ada</option>
      </select>
    </label>
    <button id="importButton" class="primary" disabled>Import ke DAPUR AYA</button>
    <progress id="progress" value="0" max="100" hidden></progress>
    <p id="importState" class="muted">Belum dijalankan.</p>
  </section>
</main>
<script type="module" src="js/import-mysql-dapur-aya.js"></script>
</body>
</html>
