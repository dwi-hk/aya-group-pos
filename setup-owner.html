<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Setup Owner AYA GROUP POS</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#111318;--card:#1b1f27;--line:#343a46;--orange:#ff8a00;
      --text:#f6f7f9;--muted:#aeb5c2;--ok:#38d27a;--bad:#ff6b6b
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(circle at top,#2b2115,var(--bg) 45%);
      color:var(--text);padding:20px
    }
    .card{
      width:min(560px,100%);background:var(--card);border:1px solid var(--line);
      border-radius:18px;padding:24px;box-shadow:0 22px 60px #0008
    }
    h1{margin:0 0 8px;font-size:26px}
    p{color:var(--muted);line-height:1.55}
    label{display:block;margin:16px 0 7px;font-weight:700}
    input{
      width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;
      background:#101319;color:var(--text);font-size:16px
    }
    button{
      width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;
      background:var(--orange);color:#17100a;font-size:16px;font-weight:900;cursor:pointer
    }
    button:disabled{opacity:.55;cursor:wait}
    #result{
      display:none;margin-top:18px;padding:14px;border-radius:11px;
      white-space:pre-wrap;word-break:break-word
    }
    .ok{display:block!important;background:#153523;border:1px solid #277b4d;color:#bcffd5}
    .bad{display:block!important;background:#3a1b1b;border:1px solid #8b3434;color:#ffd0d0}
    code{color:#ffd08a}
    .warning{border-left:4px solid var(--orange);padding-left:12px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Setup Owner AYA GROUP POS</h1>
    <p class="warning">
      Halaman ini hanya membuat profil Owner untuk akun Firebase yang Anda masukkan.
      Data lama seperti transaksi, menu, stok, dan cabang tidak dihapus.
    </p>

    <form id="setupForm">
      <label for="name">Nama Owner</label>
      <input id="name" name="name" value="Owner AYA GROUP" required>

      <label for="email">Email Firebase Authentication</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password Firebase Authentication</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>

      <button id="submitButton" type="submit">Aktifkan sebagai Owner</button>
    </form>

    <div id="result"></div>

    <p>
      Data akan dibuat pada:<br>
      <code>ayaGroupV2/users/UID_AKUN_ANDA</code>
    </p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getDatabase, ref, set, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCx0u4ka3lhjiPm84hI8U7v37GNusCvPaE",
      authDomain: "kasir-aya-group-e6fb4.firebaseapp.com",
      databaseURL: "https://kasir-aya-group-e6fb4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kasir-aya-group-e6fb4",
      storageBucket: "kasir-aya-group-e6fb4.firebasestorage.app",
      messagingSenderId: "654765768336",
      appId: "1:654765768336:web:7fb865aaf00e371de36215"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const form = document.querySelector("#setupForm");
    const button = document.querySelector("#submitButton");
    const result = document.querySelector("#result");

    function show(message, ok) {
      result.className = ok ? "ok" : "bad";
      result.textContent = message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Memproses...";
      result.className = "";
      result.style.display = "none";

      const data = new FormData(form);
      const name = String(data.get("name") || "").trim();
      const email = String(data.get("email") || "").trim();
      const password = String(data.get("password") || "");

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const uid = credential.user.uid;

        await set(ref(db, `ayaGroupV2/users/${uid}`), {
          name,
          email: credential.user.email || email,
          role: "owner",
          branchId: "all",
          active: true,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        await signOut(auth);

        show(
          `BERHASIL!\n\nUID: ${uid}\nRole: owner\nLokasi: ayaGroupV2/users/${uid}\n\nSekarang tutup halaman ini, buka AYA GROUP POS, lalu login ulang.`,
          true
        );
        form.reset();
        document.querySelector("#name").value = "Owner AYA GROUP";
      } catch (error) {
        console.error(error);
        const code = error?.code || "unknown-error";
        let help = "";

        if (code.includes("invalid-credential") || code.includes("wrong-password")) {
          help = "\n\nPeriksa kembali email dan password di Firebase Authentication.";
        } else if (code.includes("permission-denied")) {
          help = "\n\nLogin berhasil, tetapi Realtime Database Rules menolak penulisan. Buka tab Rules dan pastikan user yang login boleh menulis profilnya sendiri pada ayaGroupV2/users/UID.";
        }

        show(`GAGAL\nKode: ${code}\nPesan: ${error?.message || error}${help}`, false);
        try { await signOut(auth); } catch {}
      } finally {
        button.disabled = false;
        button.textContent = "Aktifkan sebagai Owner";
      }
    });
  </script>
</body>
</html>
